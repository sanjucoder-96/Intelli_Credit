# Alembic configuration for the IntelliCredit backend.
#
# The database URL is intentionally NOT configured here: env.py reads it from
# application Settings (IC_DATABASE__URL) and honours an ALEMBIC_DATABASE_URL
# environment-variable override for CI and one-off runs.

[alembic]
script_location = app/infrastructure/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
