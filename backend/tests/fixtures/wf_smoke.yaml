# Test-only workflow definition exercising the loader + compiler.
# Real workflow definitions live in app/workflows/definitions/ from Phase 5.
key: wf_smoke
version: 1
entity_type: corporate
nodes:
  - name: gather
    agent: noop
  - name: summarize
    agent: noop
    after: [gather]
agents:
