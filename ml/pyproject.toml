[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intellicredit-ml"
version = "0.2.0"
description = "IntelliCredit ML training pipelines — Phase-2 stub, pipelines land in Phase 6 (ADR-0010)."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
