name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: intellicredit
          POSTGRES_PASSWORD: intellicredit
          POSTGRES_DB: intellicredit
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U intellicredit -d intellicredit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IC_APP__ENV: testing
      IC_DATABASE__URL: postgresql+asyncpg://intellicredit:intellicredit@127.0.0.1:5432/intellicredit
      IC_REDIS__URL: redis://127.0.0.1:6379/0
      IC_CELERY__BROKER_URL: redis://127.0.0.1:6379/1
      IC_CELERY__RESULT_BACKEND: redis://127.0.0.1:6379/2
      IC_AUTH__JWT_SECRET: ci-only-jwt-secret-not-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install backend (with dev extras)
        run: uv pip install --system -e "backend[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Mypy (strict)
        working-directory: backend
        run: mypy app

      - name: Import-linter (layer contract)
        working-directory: backend
        run: lint-imports

      - name: Unit tests (no services required)
        working-directory: backend
        run: pytest -m "not integration"

      - name: Alembic upgrade head (pg17 + pgvector)
        working-directory: backend
        run: alembic upgrade head

      - name: Integration tests
        working-directory: backend
        env:
          IC_INTEGRATION_TESTS: "1"
        run: pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f deploy/backend.Dockerfile -t intellicredit-backend:ci .

      - name: Build frontend image
        run: docker build -f deploy/frontend.Dockerfile -t intellicredit-frontend:ci .
